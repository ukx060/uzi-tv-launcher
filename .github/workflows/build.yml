name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.UZI_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then mkdir -p keystore && echo "$KS_B64" | base64 -d > keystore/uzi.keystore; fi
      - name: Build release APK
        env:
          UZI_KEYSTORE_PASS: ${{ secrets.UZI_KEYSTORE_PASS }}
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain :app:assembleRelease 2>&1 | tee build.log
      - name: Report errors as annotations
        if: failure()
        run: |
          grep -E "^e: |error:|ERROR:|What went wrong|AAPT|Could not|> " build.log | grep -v "^> Task" | head -40 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
      - name: Lint findings as annotations
        if: always()
        run: |
          f=$(find app/build -name "lint*.txt" | head -1); [ -n "$f" ] || exit 0
          grep -E ": (Error|Warning):" "$f" | head -30 | while IFS= read -r l; do echo "::warning::${l//%/%25}"; done
      - name: Publish APK to release 'latest'
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk uzi-tv-launcher.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest build" --notes "Auto-built from main" --prerelease
          gh release upload latest uzi-tv-launcher.apk --clobber
